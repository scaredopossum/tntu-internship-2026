
name: Projects CI

on:
  push:
    branches: [main]
    paths:
      - 'src/Projects.Api/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/Projects.Api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test src/Projects.Api.Tests