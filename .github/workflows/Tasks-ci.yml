name: Tasks CI

on:
  push:
    branches: [main]
    paths:
      - 'src/Tasks.Api/**'
      - 'src/Tasks.Api.Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/Tasks.Api/**'
      - 'src/Tasks.Api.Tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test src/Tasks.Api.Tests --no-build --verbosity normal